<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Viewer Browser</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2c2f34;color:#eee;font-family:system-ui,sans-serif}
#view{width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;z-index:10;top:12px;left:12px;width:min(490px,calc(100vw - 24px));box-sizing:border-box;padding:12px;border-radius:10px;background:#141414e8;box-shadow:0 8px 24px #0008}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
input[type=file],select{width:100%;box-sizing:border-box;background:#222;color:#eee;border:1px solid #555;border-radius:7px;padding:7px}
button,label.ctrl{background:#252525;color:#eee;border:1px solid #555;border-radius:7px;padding:7px 9px;font-size:13px}
button{cursor:pointer}button:disabled,select:disabled{opacity:.45}.small{font-size:12px;color:#bbb;line-height:1.5;margin-top:8px}.title{font-weight:700;margin-bottom:8px}.label{font-size:12px;color:#bbb;margin:8px 0 4px}.exposure{display:flex;align-items:center;gap:7px;flex:1;min-width:190px}.exposure input{flex:1}.value{display:inline-block;min-width:34px;text-align:right}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
<div class="title">3Dモデルプレビュー</div>
<div class="label">ファイル選択</div>
<input id="files" type="file" multiple accept=".glb,.gltf,.obj,.mtl,.stl,.ply,.fbx,.dae,.bin,.png,.jpg,.jpeg,.webp,.bmp,.tga">
<div class="label">フォルダ選択</div>
<input id="folder" type="file" webkitdirectory multiple>
<div class="row">
<label class="ctrl"><input id="rotate" type="checkbox"> 自動回転</label>
<button id="fit">表示をリセット</button>
<div class="exposure ctrl"><span>明るさ</span><input id="exposure" type="range" min="0.5" max="2.5" step="0.05" value="1.0"><span id="exposureValue" class="value">1.00</span></div>
</div>
<div class="row"><select id="anim" disabled><option>アニメーションなし</option></select><button id="play" disabled>一時停止</button><button id="stop" disabled>停止</button></div>
<div id="info" class="small">左ドラッグ/1本指: 回転　右ドラッグ: 移動　ホイール: 拡大縮小　2本指: 拡大縮小＋移動。OBJは OBJ・MTL・テクスチャ画像を同時選択、またはフォルダ選択してください。</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {PLYLoader} from 'three/addons/loaders/PLYLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {ColladaLoader} from 'three/addons/loaders/ColladaLoader.js';
import {TGALoader} from 'three/addons/loaders/TGALoader.js';

const $=id=>document.getElementById(id);
const canvas=$('view'),fileInput=$('files'),folderInput=$('folder'),autoRotate=$('rotate'),anim=$('anim'),play=$('play'),stop=$('stop'),info=$('info'),exposure=$('exposure'),exposureValue=$('exposureValue');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2c2f34);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,100000);
camera.up.set(0,1,0);
camera.position.set(3,2,4);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=false;

const roomEnvironment=new RoomEnvironment();
const pmremGenerator=new THREE.PMREMGenerator(renderer);
const environmentRT=pmremGenerator.fromScene(roomEnvironment);
scene.environment=environmentRT.texture;
roomEnvironment.dispose();
pmremGenerator.dispose();

const hemisphere=new THREE.HemisphereLight(0xffffff,0x555555,1.15);
scene.add(hemisphere);
const keyLight=new THREE.DirectionalLight(0xffffff,2.0);keyLight.position.set(4,6,5);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0xffffff,0.8);fillLight.position.set(-4,2,3);scene.add(fillLight);

const grid=new THREE.GridHelper(10,10,0x73777d,0x4b4e53);scene.add(grid);
const axes=new THREE.AxesHelper(1.5);scene.add(axes);

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.enableRotate=true;
controls.enablePan=true;
controls.enableZoom=true;
controls.screenSpacePanning=true;
controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;
controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
controls.autoRotate=false;
controls.autoRotateSpeed=1.2;
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const clock=new THREE.Clock();
let model=null,mixer=null,clips=[],action=null,playing=true,urls=[];
let homeCameraPosition=new THREE.Vector3(3,2,4);
let homeTarget=new THREE.Vector3(0,0,0);
let homeMinDistance=0;
let homeMaxDistance=Infinity;

const supported=new Set(['glb','gltf','obj','stl','ply','fbx','dae']);
const ext=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
const norm=s=>{try{s=decodeURIComponent(String(s||''))}catch{}return s.split('?')[0].split('#')[0].replace(/\\/g,'/').replace(/^\.\//,'').replace(/\/+/g,'/')};
const base=s=>norm(s).split('/').pop().toLowerCase();
function blob(file){const u=URL.createObjectURL(file);urls.push(u);return u}
function mapFiles(files){const m=new Map();for(const f of files){for(const k of [f.name,f.webkitRelativePath].filter(Boolean)){const n=norm(k);m.set(n.toLowerCase(),f);m.set(base(n),f);const p=n.split('/');for(let i=1;i<p.length;i++)m.set(p.slice(i).join('/').toLowerCase(),f)}}m.files=files;return m}
function findFile(m,url){const n=norm(url).toLowerCase(),b=base(n);if(m.has(n))return m.get(n);if(m.has(b))return m.get(b);for(const f of m.files||[]){const p=norm(f.webkitRelativePath||f.name).toLowerCase();if(p.endsWith('/'+n)||p.endsWith('/'+b))return f}return null}
function managerFor(m){const mgr=new THREE.LoadingManager();mgr.addHandler(/\.tga$/i,new TGALoader());mgr.setURLModifier(u=>{const f=findFile(m,u);return f?blob(f):u});return mgr}

function resetAnimationUI(){anim.innerHTML='<option>アニメーションなし</option>';anim.disabled=play.disabled=stop.disabled=true;playing=false;play.textContent='再生'}
function clean(){if(action)action.stop();if(mixer)mixer.stopAllAction();mixer=null;clips=[];action=null;resetAnimationUI();if(model){scene.remove(model);disposeObject(model);model=null}urls.forEach(URL.revokeObjectURL);urls=[]}
function disposeObject(root){root.traverse(o=>{if(o.geometry)o.geometry.dispose();const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(!m)continue;for(const key of Object.keys(m)){const v=m[key];if(v&&v.isTexture)v.dispose()}m.dispose()}})}
function materialList(m){return Array.isArray(m)?m:[m]}
function normalizeMaterial(material,format){for(const m of materialList(material)){if(!m)continue;if(m.map){m.map.colorSpace=THREE.SRGBColorSpace;m.map.needsUpdate=true;if(format==='obj'&&m.color)m.color.set(0xffffff)}if(m.emissiveMap){m.emissiveMap.colorSpace=THREE.SRGBColorSpace;m.emissiveMap.needsUpdate=true}m.needsUpdate=true}}
function prep(root,format){root.traverse(o=>{if(!o.isMesh)return;o.castShadow=o.receiveShadow=false;if(!o.material)o.material=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.7,metalness:0});normalizeMaterial(o.material,format)})}

function frameModel(){
  if(!model)return;
  model.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const sphere=box.getBoundingSphere(new THREE.Sphere());
  const radius=Math.max(sphere.radius,0.001);
  const verticalFov=THREE.MathUtils.degToRad(camera.fov);
  const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*camera.aspect);
  const limitingFov=Math.max(0.01,Math.min(verticalFov,horizontalFov));
  const distance=radius/Math.sin(limitingFov/2)*1.18;
  const direction=new THREE.Vector3(1,0.65,1).normalize();

  camera.near=Math.max(distance/1000,0.001);
  camera.far=Math.max(distance*1000,1000);
  camera.position.copy(center).addScaledVector(direction,distance);
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.minDistance=Math.max(radius*0.05,0.001);
  controls.maxDistance=Math.max(radius*50,distance*4);
  controls.update();

  homeCameraPosition.copy(camera.position);
  homeTarget.copy(controls.target);
  homeMinDistance=controls.minDistance;
  homeMaxDistance=controls.maxDistance;

  grid.position.y=box.min.y;
  grid.position.x=center.x;
  grid.position.z=center.z;
  const gridScale=Math.max(Math.max(size.x,size.z)/10,0.1);
  grid.scale.setScalar(gridScale);
  axes.position.copy(center);
  axes.scale.setScalar(Math.max(radius*0.45,0.2));
}

function resetView(){
  camera.position.copy(homeCameraPosition);
  controls.target.copy(homeTarget);
  controls.minDistance=homeMinDistance;
  controls.maxDistance=homeMaxDistance;
  controls.update();
}

function setupAnim(root,a){clips=(a||[]).filter(c=>c?.tracks?.length);if(!clips.length){resetAnimationUI();return}mixer=new THREE.AnimationMixer(root);anim.innerHTML='';clips.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name?.trim()||`Animation ${i+1}`;anim.appendChild(o)});anim.disabled=play.disabled=stop.disabled=false;anim.value='0';playClip(0)}
function playClip(i){if(!mixer||!clips[i])return;mixer.stopAllAction();action=mixer.clipAction(clips[i]);action.reset().setLoop(THREE.LoopRepeat,Infinity).play();playing=true;play.textContent='一時停止'}
const promiseLoad=(loader,url,convert=x=>x)=>new Promise((res,rej)=>loader.load(url,x=>res(convert(x)),undefined,rej));

async function load(files){
  files=[...files];
  const main=files.find(f=>supported.has(ext(f.name)));
  if(!main){info.textContent='対応モデルがありません';return}
  clean();
  info.textContent='読み込み中: '+main.name;
  const fm=mapFiles(files),mgr=managerFor(fm),url=blob(main),e=ext(main.name);
  try{
    let r;
    if(e==='glb'||e==='gltf'){
      r=await promiseLoad(new GLTFLoader(mgr),url,g=>({object:g.scene,animations:g.animations||[]}));
    }else if(e==='obj'){
      const ol=new OBJLoader(mgr),mtl=files.find(f=>ext(f.name)==='mtl');
      if(mtl){
        const ml=new MTLLoader(mgr);
        ml.setMaterialOptions({ignoreZeroRGBs:true});
        const mats=await promiseLoad(ml,blob(mtl));
        mats.preload();
        ol.setMaterials(mats);
      }
      r=await promiseLoad(ol,url,o=>({object:o,animations:[]}));
    }else if(e==='stl'){
      r=await promiseLoad(new STLLoader(mgr),url,g=>{g.computeVertexNormals();return{object:new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.7,metalness:0})),animations:[]}});
    }else if(e==='ply'){
      r=await promiseLoad(new PLYLoader(mgr),url,g=>{g.computeVertexNormals();return{object:new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xdddddd,vertexColors:g.hasAttribute('color'),roughness:.7,metalness:0})),animations:[]}});
    }else if(e==='fbx'){
      r=await promiseLoad(new FBXLoader(mgr),url,o=>({object:o,animations:o.animations||[]}));
    }else if(e==='dae'){
      r=await promiseLoad(new ColladaLoader(mgr),url,c=>({object:c.scene,animations:c.animations||[]}));
    }

    model=r.object;
    scene.add(model);
    prep(model,e);
    frameModel();
    setupAnim(model,r.animations);

    const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());
    info.textContent=`表示中: ${main.name} / X=${size.x.toFixed(3)} Y=${size.y.toFixed(3)} Z=${size.z.toFixed(3)} / アニメーション: ${clips.length}件`;
  }catch(err){
    console.error(err);
    info.textContent='読み込み失敗: '+err.message;
  }
}

fileInput.addEventListener('change',e=>load(e.target.files));
folderInput.addEventListener('change',e=>load(e.target.files));
$('fit').addEventListener('click',resetView);
autoRotate.addEventListener('change',()=>{controls.autoRotate=autoRotate.checked});
exposure.addEventListener('input',()=>{renderer.toneMappingExposure=Number(exposure.value);exposureValue.textContent=Number(exposure.value).toFixed(2)});
anim.addEventListener('change',()=>playClip(Number(anim.value)));
play.addEventListener('click',()=>{if(!action)return;playing=!playing;action.paused=!playing;play.textContent=playing?'一時停止':'再生'});
stop.addEventListener('click',()=>{if(mixer)mixer.stopAllAction();action=null;playing=false;play.textContent='再生'});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});

(function loop(){requestAnimationFrame(loop);const d=clock.getDelta();if(mixer)mixer.update(d);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
